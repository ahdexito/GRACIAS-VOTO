<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias por tu voto</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f4f9; text-align: center; }
        main { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 0.5rem; }
        h2 { color: #666; font-weight: normal; font-size: 1.2rem; line-height: 1.5; max-width: 500px; }
    </style>
</head>
<body>
    <main>
        <h1>VALORACIÓN RECIBIDA</h1>
        <h2 id="mensaje">Procesando valoración...</h2>
    </main>

    <script>
        window.onload = function() {
            // Capturamos los datos de la URL (Cambiado a nombre_completo)
            const params = new URLSearchParams(window.location.search);
            const voto = params.get('voto');
            const email = params.get('email');
            const nombreCompleto = params.get('nombre_completo');
            
            // Lógica para extraer solo el primer nombre
            let primerNombre = "cliente";
            
            if (nombreCompleto && nombreCompleto !== "null" && nombreCompleto.trim() !== "") {
                // Dividimos por espacios y tomamos el primer elemento
                primerNombre = nombreCompleto.trim().split("%")[0];
            }

            const mensajeH2 = document.getElementById('mensaje');

            // Definimos los mensajes personalizados usando solo el primer nombre
            const mensajesPersonalizados = {
                '1': `Sentimos mucho tu experiencia, ${primerNombre}. Nos pondremos en contacto contigo pronto.`,
                '2': `Lamentamos no haber estado a la altura, ${primerNombre}. Gracias por ayudarnos a mejorar.`,
                '3': `Gracias por tu valoración, ${primerNombre}. Seguiremos trabajando para darte un mejor servicio.`,
                '4': `¡Muchas gracias, ${primerNombre}! Nos alegra que tu experiencia haya sido buena.`,
                '5': `¡Excelente! Mil gracias por tu confianza, ${primerNombre}. Nos motiva mucho tu valoración.`
            };

            // Verificamos datos y enviamos a Google
            if (email && voto) {
                const googleURL = "https://script.google.com/macros/s/AKfycbzWn4zHreJIa_BvNRIjbr_ESKaiY8lAzDY3MSpQSGrnfYcohLsNAuY6Ayj80UsSU1Bv/exec";
                
                // Enviamos el NOMBRE COMPLETO al Excel (para tener el dato profesional)
                // Pero mostramos solo el PRIMER NOMBRE en pantalla (para cercanía)
                const img = new Image();
                const urlFinal = `${googleURL}?voto=${encodeURIComponent(voto)}&email=${encodeURIComponent(email)}&nombre=${encodeURIComponent(nombreCompleto || "Cliente")}&t=${new Date().getTime()}`;
                img.src = urlFinal;
                
                // Cambiamos el texto del H2 inmediatamente
                if (mensajesPersonalizados[voto]) {
                    mensajeH2.innerText = mensajesPersonalizados[voto];
                } else {
                    mensajeH2.innerText = "¡Gracias por tu valoración!";
                }
                
                console.log("Datos enviados para:", email);

            } else {
                mensajeH2.innerText = "Bienvenido a nuestra página de atención al cliente.";
            }
        };
    </script>
</body>
</html>
